<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" font-family="sans-serif" font-size="12">
<rect width="1040" height="580" fill="white"/>
<text x="520" y="24" text-anchor="middle" font-size="15" font-weight="bold">Host-connected workbench: block diagram (design only; the UI uses C++ mock adapters)</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
<rect x="20" y="50" width="270" height="480" rx="8" fill="#eef4ff" stroke="#1f5fbf" stroke-width="2"/>
<text x="155" y="74" text-anchor="middle" font-weight="bold">HOST PC (Windows 11 x64 / macOS)</text>
<rect x="35" y="90" width="240" height="56" rx="5" fill="white" stroke="#1f5fbf" />
<text x="155" y="110" text-anchor="middle">Browser UI (web/)</text>
<text x="155" y="128" text-anchor="middle" fill="#555">HTTP/JSON on 127.0.0.1 only</text>
<rect x="35" y="166" width="240" height="56" rx="5" fill="white" stroke="#1f5fbf" />
<text x="155" y="186" text-anchor="middle">C++ server (Launch.exe)</text>
<text x="155" y="204" text-anchor="middle" fill="#555">src/server: transport only</text>
<rect x="35" y="242" width="240" height="100" rx="5" fill="white" stroke="#1f5fbf" />
<text x="155" y="262" text-anchor="middle">Device layer (wb_core)</text>
<text x="155" y="280" text-anchor="middle" fill="#555">discover / capabilities / connect /</text>
<text x="155" y="296" text-anchor="middle" fill="#555">disconnect / telemetry / retry</text>
<text x="155" y="312" text-anchor="middle" fill="#a33">TODAY: simulated adapters only</text>
<rect x="35" y="362" width="240" height="60" rx="5" fill="white" stroke="#1f5fbf" stroke-dasharray="4"/>
<text x="155" y="382" text-anchor="middle">One driver per device type</text>
<text x="155" y="400" text-anchor="middle" fill="#555">different protocols, never shared</text>
<rect x="35" y="442" width="240" height="78" rx="5" fill="#fff8e1" stroke="#b8860b" />
<text x="155" y="462" text-anchor="middle">Host USB ports</text>
<text x="155" y="480" text-anchor="middle" fill="#555">5 V VBUS + GND per port</text>
<text x="155" y="496" text-anchor="middle" fill="#555">powered hub for the FPGA board</text>
<text x="155" y="512" text-anchor="middle" fill="#555">common GND via USB shield</text>
<line x1="155" y1="146" x2="155" y2="166" stroke="#333" marker-end="url(#a)"/>
<line x1="155" y1="222" x2="155" y2="242" stroke="#333" marker-end="url(#a)"/>
<line x1="155" y1="342" x2="155" y2="362" stroke="#333" marker-end="url(#a)"/>
<line x1="155" y1="422" x2="155" y2="442" stroke="#333" marker-end="url(#a)"/>
<rect x="340" y="50" width="330" height="130" rx="8" fill="#f0fbf0" stroke="#2e7d32" stroke-width="2"/>
<text x="505.0" y="72" text-anchor="middle" font-weight="bold">MICROCONTROLLER BOARD</text>
<text x="505.0" y="92" text-anchor="middle" fill="#222">Domain A: 5 V USB in, 3.3 V logic (assumed)</text>
<text x="505.0" y="110" text-anchor="middle" fill="#222">Host link: USB CDC serial (virtual COM)</text>
<text x="505.0" y="128" text-anchor="middle" fill="#222">Debug: SWD/JTAG header on its own connector</text>
<text x="505.0" y="146" text-anchor="middle" fill="#555">Telemetry: board temperature, supply voltage</text>
<rect x="340" y="200" width="330" height="160" rx="8" fill="#fdf0f5" stroke="#ad1457" stroke-width="2"/>
<text x="505.0" y="222" text-anchor="middle" font-weight="bold">FPGA BOARD</text>
<text x="505.0" y="242" text-anchor="middle" fill="#222">Domain B: own supply (5 V / 2 A assumed)</text>
<text x="505.0" y="260" text-anchor="middle" fill="#222">Core 1.2 V; I/O bank 3.3 V (assumed, may be 1.8 V)</text>
<text x="505.0" y="278" text-anchor="middle" fill="#222">Host link: UART via on-board USB bridge</text>
<text x="505.0" y="296" text-anchor="middle" fill="#222">JTAG header: TCK TMS TDI TDO GND VTref</text>
<text x="505.0" y="314" text-anchor="middle" fill="#555">Telemetry: configured flag, clock, core voltage</text>
<text x="505.0" y="332" text-anchor="middle" fill="#a33">No programming implemented (out of scope)</text>
<rect x="340" y="380" width="330" height="140" rx="8" fill="#f5f0ff" stroke="#5e35b1" stroke-width="2"/>
<text x="505.0" y="402" text-anchor="middle" font-weight="bold">JTAG DEBUG ADAPTER</text>
<text x="505.0" y="422" text-anchor="middle" fill="#222">Domain C: USB-powered; target side follows VTref</text>
<text x="505.0" y="440" text-anchor="middle" fill="#222">Drives TCK, TMS, TDI (+ optional TRST/SRST)</text>
<text x="505.0" y="458" text-anchor="middle" fill="#222">Reads TDO; senses VTref; outputs tri-stated</text>
<text x="505.0" y="476" text-anchor="middle" fill="#222">when VTref is absent. Level shifting in adapter.</text>
<text x="505.0" y="494" text-anchor="middle" fill="#555">Debug interface only: no application code runs on it</text>
<line x1="290" y1="115" x2="340" y2="115" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#a)"/>
<text x="315" y="109" text-anchor="middle" font-size="10" fill="#2e7d32">USB</text>
<line x1="290" y1="280" x2="340" y2="280" stroke="#ad1457" stroke-width="2.5" marker-end="url(#a)"/>
<text x="315" y="274" text-anchor="middle" font-size="10" fill="#ad1457">USB-UART</text>
<line x1="290" y1="450" x2="340" y2="450" stroke="#5e35b1" stroke-width="2.5" marker-end="url(#a)"/>
<text x="315" y="444" text-anchor="middle" font-size="10" fill="#5e35b1">USB</text>
<path d="M670 480 L720 480 L720 300 L670 300" fill="none" stroke="#5e35b1" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#a)"/>
<path d="M670 500 L770 500 L770 150 L670 150" fill="none" stroke="#5e35b1" stroke-width="1.5" stroke-dasharray="2 4" marker-end="url(#a)"/>
<text x="785" y="330" font-size="11" fill="#5e35b1">Primary: JTAG cable to the FPGA header.</text>
<text x="785" y="346" font-size="11" fill="#5e35b1">VTref is taken from the FPGA I/O supply.</text>
<text x="785" y="230" font-size="11" fill="#5e35b1">Alternative (dotted): a separate cable to</text>
<text x="785" y="246" font-size="11" fill="#5e35b1">the MCU debug header. One target at a time,</text>
<text x="785" y="262" font-size="11" fill="#5e35b1">never daisy-chained across voltage domains.</text>
<text x="20" y="560" fill="#555">Solid = USB data/power. Dashed/dotted = JTAG debug cables. Colours mark separate voltage domains A, B, C. Voltages are design assumptions to verify against datasheets.</text>
</svg>
