name: build-windows-x64

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure (MSVC, x64, static CRT)
        run: cmake -S . -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Check Launch.exe depends only on system DLLs (clean-machine proof)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          & $dumpbin.FullName /dependents build\Release\Launch.exe | Tee-Object -FilePath dependents.txt
          if (Select-String -Path dependents.txt -Pattern 'VCRUNTIME|MSVCP|api-ms-win-crt|ucrtbase') { throw 'Launch.exe depends on the VC++ runtime; static CRT is not in effect.' }

      - name: Assemble distributable folder
        shell: pwsh
        run: |
          $d = "dist\CandidateID_Workbench"
          New-Item -ItemType Directory -Force $d, "$d\docs" | Out-Null
          Copy-Item build\Release\Launch.exe $d
          foreach ($x in 'web','data','results','src','tests','tools','third_party','.vscode','scripts','.github') { if (Test-Path $x) { Copy-Item $x "$d\$x" -Recurse } }
          if (Test-Path docs) { Copy-Item docs\* "$d\docs" -Recurse -Force }
          Copy-Item CMakeLists.txt,README.md,.gitignore $d
          git log --pretty=format:"%h %ad %an  %s" --date=short > "$d\docs\commit_log.txt"
          git bundle create "$d\workbench.bundle" --all
          Copy-Item dependents.txt "$d\docs\launch_exe_dependencies.txt"

      - name: Pre-submission check (required files, absolute paths, personal data, credentials)
        shell: pwsh
        run: python scripts/check_submission.py dist\CandidateID_Workbench

      - name: Smoke test the packaged Launch.exe (starts, serves UI and API)
        shell: pwsh
        run: |
          $p = Start-Process "dist\CandidateID_Workbench\Launch.exe" -ArgumentList "--no-browser --port 8765" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            try { $r = Invoke-RestMethod http://127.0.0.1:8765/api/ping; if ($r.ok) { $ok = $true; break } } catch { Start-Sleep -Milliseconds 300 }
          }
          if (-not $ok) { throw 'Launch.exe did not start serving' }
          $page = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing
          if ($page.Content -notmatch 'Unified Engineering Workbench') { throw 'index.html not served' }
          $fea = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8765/api/fea/solve -Body '{"N":10}'
          if ([math]::Abs($fea.maxMidpointError - 1.25) -gt 1e-9) { throw "unexpected FEA midpoint error $($fea.maxMidpointError)" }
          $stl = Invoke-RestMethod http://127.0.0.1:8765/api/examples/stl
          if ($stl.triangles -ne 96) { throw 'example STL not loaded' }
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:8765/api/shutdown | Out-Null
          Start-Sleep -Seconds 2
          if (-not $p.HasExited) { throw 'Launch.exe did not exit after shutdown' }
          'SMOKE TEST PASSED' | Tee-Object -FilePath dist\CandidateID_Workbench\docs\windows_smoke_test.txt

      - uses: actions/upload-artifact@v4
        with:
          name: CandidateID_Workbench
          path: dist/CandidateID_Workbench

      - name: Publish test build as a pre-release (plain download link, no login needed)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Contents at the zip root: Windows 'Extract All' already creates a CandidateID_Workbench folder, so no nested folder.
          Get-ChildItem -Force dist\CandidateID_Workbench | Compress-Archive -DestinationPath CandidateID_Workbench.zip -Force
          python -c "import zipfile,sys; n=zipfile.ZipFile('CandidateID_Workbench.zip').namelist(); print(len(n),'entries'); assert 'Launch.exe' in n, 'Launch.exe not at zip root'; assert any(x.startswith('web/') for x in n); assert any(x.startswith('.vscode/') for x in n), '.vscode missing'; assert not any(x.startswith('CandidateID_Workbench/') for x in n); print('zip layout OK')"
          gh release delete latest-build --yes --cleanup-tag 2>$null
          gh release create latest-build CandidateID_Workbench.zip --prerelease --title "CandidateID_Workbench.zip (latest build)" --notes "Automatic CI build of the submission package."
